<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESCUE-BOT — ภารกิจหุ่นยนต์กู้ภัย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
  // สำรอง: หาก CDN หลัก (jsDelivr) โหลดไม่สำเร็จ (เช่น เครือข่ายโรงเรียนบล็อก) ให้ลอง CDN สำรองอัตโนมัติ
  window.addEventListener("error", function(e){
    if(e.target && e.target.tagName === "SCRIPT" && /chart.*\.js/i.test(e.target.src) && !window.Chart && !window.__chartFallbackTried){
      window.__chartFallbackTried = true;
      var s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js";
      document.head.appendChild(s);
    }
  }, true);
</script>
<style>
/* ============ DESIGN TOKENS ============
   Color: base #0F1720 (command-console navy), panel #16212C,
   teal (SHOW/robot) #3FCFB4, amber (LEARN/field) #F2A93B,
   safety-orange (APPLY/action) #FF6A39, ember (danger/fire) #E5484D,
   signal-green (REFLECT/complete) #6FCF97, text #EAF2F1, muted #85A0AA
   Type: Space Grotesk (headlines) / Inter (body) / IBM Plex Mono (telemetry data)
*/
:root{
  --bg:#0F1720;
  --panel:#16212C;
  --panel-raised:#1C2A36;
  --line:#26374380;
  --line-strong:#2C3F4C;
  --text:#EAF2F1;
  --muted:#85A0AA;
  --teal:#3FCFB4;
  --amber:#F2A93B;
  --orange:#FF6A39;
  --ember:#E5484D;
  --green:#6FCF97;
  --font-head:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:36px 36px;
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.55;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-head);margin:0 0 .4em 0;font-weight:600;letter-spacing:.01em;}
p{margin:0 0 1em 0;}
.mono{font-family:var(--font-mono);}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--teal);color:#04211C;}

#app{max-width:920px;margin:0 auto;padding:20px 18px 80px;}

/* ---------- Status bar ---------- */
.statusbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:14px;
  background:rgba(15,23,32,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line-strong);
  padding:10px 4px;margin:0 -18px 22px;padding-left:18px;padding-right:18px;
}
.statusbar .who{font-size:.82rem;color:var(--muted);white-space:nowrap;}
.statusbar .who b{color:var(--text);font-weight:600;}
.statusbar .phase-track{display:flex;gap:6px;flex:1;}
.statusbar .phase-item{flex:1;display:flex;flex-direction:column;gap:4px;align-items:stretch;}
.statusbar .phase-label{
  font-size:.66rem;letter-spacing:.03em;color:var(--muted);text-align:center;
  font-family:var(--font-mono);white-space:nowrap;
}
.statusbar .phase-item.active .phase-label{color:var(--teal);font-weight:600;}
.statusbar .phase-item.done .phase-label{color:var(--text);}
.statusbar .phase-dot{
  height:6px;border-radius:3px;background:var(--line-strong);position:relative;overflow:hidden;
}
.statusbar .phase-dot.active{background:var(--teal);}
.statusbar .phase-dot.done{background:var(--muted);}
.statusbar .timer{font-family:var(--font-mono);font-size:.82rem;color:var(--amber);white-space:nowrap;}
.statusbar .timer.low-time{color:var(--ember);}

/* ---------- Panels / cards ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--line-strong);
  padding:26px 26px 24px;
  margin-bottom:20px;
  position:relative;
}
.panel::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--accent, var(--teal));
}
.panel.show-accent::before{background:var(--teal);}
.panel.learn-accent::before{background:var(--amber);}
.panel.apply-accent::before{background:var(--orange);}
.panel.reflect-accent::before{background:var(--green);}

.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.78rem;color:var(--muted);margin-bottom:10px;
}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--teal));}

.kicker-title{font-size:1.5rem;}
.lede{color:var(--muted);font-size:.98rem;}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line-strong);
  background:var(--panel-raised);
  color:var(--text);
  padding:11px 20px;
  font-size:.94rem;
  font-weight:600;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
.btn:hover{border-color:var(--muted);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-primary{background:var(--teal);border-color:var(--teal);color:#04241E;}
.btn-primary:hover{background:#59DABF;border-color:#59DABF;}
.btn-apply{background:var(--orange);border-color:var(--orange);color:#2A0D02;}
.btn-apply:hover{background:#FF8A5E;border-color:#FF8A5E;}
.btn-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;}
.btn-ghost{background:transparent;}

/* ---------- Intro screen ---------- */
.hero{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:38px 20px 10px;
}
.hero svg{width:min(460px,88vw);height:auto;margin-bottom:8px;filter:drop-shadow(0 12px 28px #00000055);}
.hero h1{font-size:2.1rem;max-width:560px;}
.hero .tag{color:var(--muted);max-width:520px;margin:0 auto 20px;}
.field-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;text-align:left;}
.field-row label{font-size:.86rem;color:var(--muted);}
.field-row input, .field-row select{
  background:var(--panel-raised);border:1px solid var(--line-strong);color:var(--text);
  padding:11px 12px;font-size:1rem;font-family:var(--font-body);
}
.field-row input:focus, .field-row select:focus{outline:2px solid var(--teal);outline-offset:1px;}
.form-card{max-width:380px;width:100%;margin:0 auto;background:var(--panel-raised);border:1px solid var(--line-strong);padding:22px;}
.mission-brief{
  text-align:left;font-size:.86rem;color:var(--muted);margin-top:18px;padding:14px 16px;
  border-left:3px solid var(--amber);background:#1B140B33;
}

/* ---------- Progress ---------- */
.progress-wrap{margin:16px 0 4px;}
.progress-track{height:8px;background:var(--panel-raised);border:1px solid var(--line-strong);}
.progress-fill{height:100%;background:var(--teal);transition:width .3s ease;}
.progress-label{font-size:.78rem;color:var(--muted);margin-top:6px;font-family:var(--font-mono);}

/* ---------- Quiz (SHOW / LEARN checks) ---------- */
.q-index{font-family:var(--font-mono);color:var(--muted);font-size:.82rem;margin-bottom:6px;}
.q-text{font-size:1.15rem;margin-bottom:18px;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice{
  display:flex;align-items:center;gap:12px;
  border:1px solid var(--line-strong);padding:13px 15px;
  background:var(--panel-raised);
  transition:border-color .12s ease, background .12s ease;
}
.choice:hover{border-color:var(--teal);}
.choice input{accent-color:var(--teal);width:16px;height:16px;flex-shrink:0;}
.choice.selected{border-color:var(--teal);background:#123832;}
.choice label{flex:1;cursor:pointer;font-size:.96rem;}

/* ---------- Learn ---------- */
.concept-tag{
  display:inline-block;font-size:.74rem;color:var(--amber);
  border:1px solid var(--amber);padding:2px 9px;margin-bottom:12px;
}
.chart-box{background:var(--panel-raised);border:1px solid var(--line-strong);padding:16px;margin:16px 0;height:260px;}

/* ---------- Drag & drop (LEARN tasks 7-8) ---------- */
.dd-hint{font-size:.8rem;color:var(--muted);margin:14px 0 8px;}
.dropzone{
  min-height:42px;display:flex;align-items:center;justify-content:center;
  border:2px dashed var(--line-strong);background:#12181F;
  padding:6px 10px;font-size:.86rem;color:var(--muted);text-align:center;
  transition:border-color .12s ease, background .12s ease;
}
.dropzone.over{border-color:var(--amber);background:#221a0d;}
.dropzone.filled{border-style:solid;border-color:var(--amber);background:#241d10;color:var(--text);cursor:pointer;}
.dropzone.filled:hover{border-color:var(--ember);}
.chip{
  display:inline-block;border:1px solid var(--line-strong);background:var(--panel-raised);
  color:var(--text);padding:8px 13px;font-size:.85rem;cursor:grab;
  transition:border-color .12s ease, transform .1s ease;
}
.chip:hover{border-color:var(--amber);transform:translateY(-1px);}
.chip.selected{border-color:var(--amber);background:#2a2110;box-shadow:0 0 0 2px #F2A93B55;}
.chip.cond{border-radius:16px;border-color:#3FCFB480;}
.chip.cond.selected{border-color:var(--amber);}
.chip-pool{display:flex;flex-wrap:wrap;gap:9px;padding:14px;background:#12181F;border:1px solid var(--line-strong);}
.chip-pool.empty::after{content:"วางครบทุกช่องแล้ว";color:var(--muted);font-size:.84rem;}

/* circuit workbench (Tinkercad-style) */
.tinker-wrap{
  background:#0C1218;border:1px solid var(--line-strong);margin:16px 0;overflow:hidden;
}
.tinker-bar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#16212C;border-bottom:1px solid var(--line-strong);font-size:.78rem;color:var(--muted);
}
.tinker-bar .tdot{width:9px;height:9px;border-radius:50%;}
.tinker-canvas{
  position:relative;width:100%;aspect-ratio:16/10;min-height:330px;
  background-color:#0C1218;
  background-image:radial-gradient(#1E2C38 1px, transparent 1px);
  background-size:16px 16px;
}
.tinker-canvas svg{position:absolute;inset:0;width:100%;height:100%;}
.tk-slot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:.72rem;line-height:1.25;padding:5px 7px;
  border:2px dashed #3A4D5C;background:#121C24EE;color:var(--muted);
  cursor:pointer;transition:border-color .12s ease,background .12s ease;
}
.tk-slot.over{border-color:var(--amber);background:#241d10EE;}
.tk-slot.filled{border-style:solid;border-color:var(--amber);background:#241d10EE;color:var(--text);}
.tk-slot.filled:hover{border-color:var(--ember);}
.tk-pin{
  position:absolute;transform:translate(-50%,-50%);
  font-family:var(--font-mono);font-size:.64rem;color:var(--teal);
  background:#0C1218;padding:1px 4px;border:1px solid #2C3F4C;
}
.tk-caption{font-size:.74rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line-strong);background:#101A22;}

/* block program test panel */
.run-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 10px;}
.btn-run{background:var(--green);border-color:var(--green);color:#06230F;font-weight:700;}
.btn-run:hover{background:#8BDCAD;border-color:#8BDCAD;}
.run-count{font-family:var(--font-mono);font-size:.82rem;color:var(--muted);}
.run-result{border:1px solid var(--line-strong);padding:14px 16px;margin-bottom:12px;background:var(--panel-raised);}
.run-result.ok{border-left:4px solid var(--green);}
.run-result.fail{border-left:4px solid var(--ember);}
.run-result .rr-title{font-weight:700;margin-bottom:6px;}
.run-result.ok .rr-title{color:var(--green);}
.run-result.fail .rr-title{color:var(--ember);}
.run-result .rr-detail{font-size:.84rem;color:var(--muted);}
.run-log{font-family:var(--font-mono);font-size:.74rem;color:var(--muted);margin-top:8px;max-height:96px;overflow-y:auto;}
/* circuit progress + fire gauges */
.circ-progress{background:var(--panel-raised);border:1px solid var(--line-strong);padding:12px 14px;margin:14px 0 4px;}
.cp-head{display:flex;justify-content:space-between;align-items:center;font-size:.84rem;margin-bottom:8px;}
.cp-pct{color:var(--amber);font-weight:600;}
.cp-track{height:9px;background:#12181F;border:1px solid var(--line-strong);}
.cp-fill{height:100%;background:var(--amber);transition:width .25s ease;}
.cp-fill.done{background:var(--green);}
.tk-bar-hint{font-size:.72rem;}
.fire-gauges{background:var(--panel-raised);border:1px solid var(--line-strong);padding:14px;margin:14px 0;}
.gauge-row{display:grid;grid-template-columns:150px 1fr 62px;gap:10px;align-items:center;margin-bottom:9px;}
.gauge-label{font-size:.82rem;color:var(--muted);}
.gauge-track{height:14px;background:#12181F;border:1px solid var(--line-strong);overflow:hidden;}
.gauge-fill{height:100%;transition:width .3s ease, background .3s ease;}
.gauge-fill.hot{background:var(--ember);}
.gauge-fill.warm{background:var(--amber);}
.gauge-fill.safe{background:var(--green);}
.gauge-fill.water{background:#4FA3E3;}
.gauge-val{font-size:.84rem;text-align:right;color:var(--text);}
.gauge-legend{font-size:.76rem;color:var(--muted);margin-top:6px;}
@media (max-width:560px){ .gauge-row{grid-template-columns:110px 1fr 54px;gap:7px;} .gauge-label{font-size:.72rem;} }
.gm-cell.path{background:#1B3A46;border-color:#3FCFB466;}
.gm-cell.final{outline:2px solid var(--amber);outline-offset:-2px;}
.gm-cell{transition:background .18s ease, outline-color .18s ease;}
.anim-status{
  display:flex;align-items:center;gap:9px;font-size:.84rem;color:var(--text);
  background:#12242B;border:1px solid #3FCFB455;border-left:4px solid var(--teal);
  padding:10px 14px;margin:10px 0;
}
.anim-dot{
  width:9px;height:9px;border-radius:50%;background:var(--teal);flex:0 0 auto;
  animation:animPulse 1s ease-in-out infinite;
}
@keyframes animPulse{0%,100%{opacity:1;}50%{opacity:.25;}}
@media (prefers-reduced-motion: reduce){ .anim-dot{animation:none;} .gm-cell{transition:none;} }

/* block program */
.block-prog{background:#12181F;border:1px solid var(--line-strong);padding:16px;margin:16px 0;font-size:.9rem;}
.block-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.block-row .bl-text{color:var(--text);}
.block-row .bl-kw{color:var(--amber);font-weight:600;}
.block-row .dropzone{min-width:190px;flex:0 1 auto;}
.blk-indent-1{margin-left:22px;border-left:2px solid #2C3F4C;padding-left:12px;}
.blk-indent-2{margin-left:44px;border-left:2px solid #2C3F4C;padding-left:12px;}
.blk-indent-3{margin-left:66px;border-left:2px solid #3FCFB455;padding-left:12px;}
.grid-map{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;max-width:230px;margin:14px auto 4px;}
.gm-cell{aspect-ratio:1;background:#1C2A36;border:1px solid #26374380;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.gm-cell.obstacle{background:#3A2417;border-color:#FF6A3966;}
.gm-cell.bot{background:#FF6A3933;border-color:var(--orange);}
.gm-cell.valve{background:#12321F;border-color:var(--green);}
.grid-legend{font-size:.76rem;color:var(--muted);text-align:center;margin-bottom:4px;}

/* ---------- Apply ---------- */
.factor-slider{margin-bottom:16px;}
.factor-slider .fs-head{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px;}
.factor-slider .fs-head b{color:var(--text);}
.factor-slider .fs-head span{font-family:var(--font-mono);color:var(--orange);}
input[type=range]{
  width:100%;height:6px;border-radius:3px;background:var(--line-strong);
  -webkit-appearance:none;appearance:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--orange);cursor:pointer;border:2px solid #1B0A02;
}
input[type=range]::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;background:var(--orange);border:2px solid #1B0A02;cursor:pointer;
}
.accuracy-readout{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--panel-raised);border:1px solid var(--line-strong);
  padding:14px 18px;margin:16px 0;
}
.accuracy-readout .num{font-family:var(--font-mono);font-size:1.7rem;font-weight:600;color:var(--orange);}
.accuracy-readout.perfect .num{color:var(--green);}
.mission-table{width:100%;border-collapse:collapse;font-size:.84rem;margin-top:10px;}
.mission-table th, .mission-table td{
  text-align:left;padding:7px 8px;border-bottom:1px solid var(--line-strong);
}
.mission-table th{color:var(--muted);font-weight:600;font-size:.76rem;}
.tag-pill{display:inline-block;padding:2px 9px;font-size:.74rem;font-family:var(--font-mono);}
.tag-Low{background:#123832;color:var(--teal);}
.tag-Medium{background:#2E260F;color:var(--amber);}
.tag-High{background:#3A1414;color:var(--ember);}
.tag-GO{background:#123832;color:var(--teal);}
.tag-WAIT{background:#3A1414;color:var(--ember);}
.match-yes{color:var(--green);}
.match-no{color:var(--ember);}

/* ---------- Reflect ---------- */
.likert-item{margin-bottom:20px;}
.likert-item p{margin-bottom:10px;font-size:.96rem;}
.likert-scale{display:flex;gap:8px;flex-wrap:wrap;}
.likert-opt{flex:1;min-width:80px;text-align:center;}
.likert-opt input{display:none;}
.likert-opt span{
  display:block;border:1px solid var(--line-strong);padding:9px 4px;font-size:.78rem;
  background:var(--panel-raised);color:var(--muted);
}
.likert-opt input:checked + span{border-color:var(--green);background:#12321F;color:var(--green);}
textarea{
  width:100%;background:var(--panel-raised);border:1px solid var(--line-strong);color:var(--text);
  padding:12px;font-family:var(--font-body);font-size:.94rem;min-height:88px;resize:vertical;
}
textarea:focus{outline:2px solid var(--green);outline-offset:1px;}
.word-count{font-size:.76rem;color:var(--muted);text-align:right;font-family:var(--font-mono);margin-top:4px;}

/* ---------- Report ---------- */
.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0;}
.score-card{background:var(--panel-raised);border:1px solid var(--line-strong);padding:16px;}
.score-card .label{font-size:.78rem;color:var(--muted);margin-bottom:6px;}
.score-card .val{font-family:var(--font-mono);font-size:1.6rem;font-weight:600;}
.overall-band{
  text-align:center;padding:28px 20px;margin:20px 0;border:1px solid var(--line-strong);
  background:linear-gradient(180deg,var(--panel-raised),var(--panel));
}
.overall-band .level{font-family:var(--font-head);font-size:2.4rem;margin:6px 0;}
.overall-band .score-big{font-family:var(--font-mono);font-size:1rem;color:var(--muted);}
.L4{color:var(--green);} .L3{color:var(--teal);} .L2{color:var(--amber);} .L1{color:var(--ember);}
.hist-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:10px;}
.hist-table th,.hist-table td{padding:8px;border-bottom:1px solid var(--line-strong);text-align:left;}
.hist-table th{color:var(--muted);font-size:.74rem;}
.save-status{font-size:.82rem;color:var(--muted);margin-top:10px;font-family:var(--font-mono);line-height:1.5;}
.save-status.ok{color:var(--green);}
.save-status.warn{color:var(--amber);}
.save-status.fail{color:var(--ember);}
.hidden{display:none !important;}
.help-note{font-size:.82rem;color:var(--muted);margin-top:12px;padding:10px 14px;border-left:3px solid var(--teal);background:#0E2A2833;}
@media (max-width:560px){
  .hero h1{font-size:1.5rem;}
  .panel{padding:20px 16px;}
  .statusbar{gap:8px;}
  .statusbar .who{font-size:.72rem;}
  .statusbar .phase-label{font-size:.58rem;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   RESCUE-BOT — PISA LDW Practice Test
   Config
   ========================================================= */
const CONFIG = {
  // Web App (Apps Script) แบบ universal logger — ดูไฟล์ code.gs ที่ผูกกับสเปรดชีตนี้

let countdownIntervalId = null;

function formatCountdown(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s/60);
  const ss = s%60;
  return m + ":" + String(ss).padStart(2,"0");
}
function startCountdown(){
  if(countdownIntervalId) clearInterval(countdownIntervalId);
  countdownIntervalId = setInterval(updateTimerDisplay, 1000);
  updateTimerDisplay();
}
function updateTimerDisplay(){
  const timerEl = document.getElementById("timerDisplay");
  if(!timerEl || !state.startTime){ return; }
  const elapsed = (Date.now() - state.startTime) / 1000;
  const remaining = CONFIG.totalMinutes*60 - elapsed;
  timerEl.textContent = "เหลือเวลา " + formatCountdown(remaining);
  timerEl.classList.toggle("low-time", remaining <= 60);
  if(remaining <= 0){
    state.timedOut = true;
    if(countdownIntervalId){ clearInterval(countdownIntervalId); countdownIntervalId = null; }
  }
}

/* =========================================================
   HELPERS
   ========================================================= */
function scoreOf(f,w){ const s=w.reduce((a,b)=>a+b,0)||1; return f.reduce((acc,v,i)=>acc+v*w[i],0)/s; }
function label3(s,lo,hi){ return s<lo?"Low":(s<hi?"Medium":"High"); }
function labelThai(l){ return l==="Low"?"ต่ำ":l==="Medium"?"ปานกลาง":l==="High"?"สูง":l; }
function pct(n){ return Math.round(n*10)/10; }
function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k==="class") e.className=attrs[k];
    else if(k==="html") e.innerHTML=attrs[k];
    else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if(k==="disabled" || k==="checked"){
      if(attrs[k]) e.setAttribute(k, "");
      else e.removeAttribute(k);
    }
    else if(attrs[k]===false || attrs[k]==null) { /* skip falsy boolean-ish attrs */ }
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c=>{
    if(c==null) return;
    if(typeof c==="string" || typeof c==="number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
}
function destroyCharts(){ Object.values(chartInstances).forEach(c=>c && c.destroy()); chartInstances={}; }

/* ---------- Drag & drop helpers ---------- */
function dragAnswersFor(taskId){
  if(!state.dragAnswers[taskId]) state.dragAnswers[taskId] = {};
  return state.dragAnswers[taskId];
}
function dragTaskComplete(t){
  const ans = dragAnswersFor(t.id);
  return t.slots.every(s=>ans[s.id]);
}
function placedItemIds(t){
  const ans = dragAnswersFor(t.id);
  return Object.values(ans).filter(Boolean);
}
function placeChip(t, slotId, itemId){
  stopAnim();
  const ans = dragAnswersFor(t.id);
  // ชิ้นหนึ่งวางได้ช่องเดียว: ถ้าถูกวางที่อื่นอยู่ ให้ย้ายมาช่องใหม่
  Object.keys(ans).forEach(k=>{ if(ans[k]===itemId) delete ans[k]; });
  ans[slotId] = itemId;
  state.selectedChip = null;
  render();
}
function clearSlot(t, slotId){
  stopAnim();
  const ans = dragAnswersFor(t.id);
  delete ans[slotId];
  render();
}
function buildDropzone(t, slot, placeholder){
  const ans = dragAnswersFor(t.id);
  const itemId = ans[slot.id];
  const item = itemId ? t.items.find(x=>x.id===itemId) : null;
  const zone = el("div",{
    class:"dropzone"+(item?" filled":""),
    title: item ? "แตะเพื่อเอาออก" : slot.label
  }, item ? item.label : (placeholder || slot.label || "ลากมาวางที่นี่"));

  zone.addEventListener("dragover",(e)=>{ e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave",()=>zone.classList.remove("over"));
  zone.addEventListener("drop",(e)=>{
    e.preventDefault(); zone.classList.remove("over");
    const id = e.dataTransfer.getData("text/plain");
    if(id) placeChip(t, slot.id, id);
  });
  zone.addEventListener("click",()=>{
    if(state.selectedChip){ placeChip(t, slot.id, state.selectedChip); }
    else if(item){ clearSlot(t, slot.id); }
  });
  return zone;
}
function buildChipPool(t){
  const used = placedItemIds(t);
  const remaining = t.items.filter(it=>used.indexOf(it.id)===-1);
  const pool = el("div",{class:"chip-pool"+(remaining.length===0?" empty":"")});
  remaining.forEach(it=>{
    const chip = el("div",{
      class:"chip"+(it.type==="cond"?" cond":"")+(state.selectedChip===it.id?" selected":""),
      draggable:"true"
    }, it.label);
    chip.addEventListener("dragstart",(e)=>{ e.dataTransfer.setData("text/plain", it.id); });
    chip.addEventListener("click",()=>{
      state.selectedChip = (state.selectedChip===it.id) ? null : it.id;
      render();
    });
    pool.appendChild(chip);
  });
  return el("div",{},
    el("div",{class:"dd-hint"}, remaining.length===0
      ? "วางครบทุกช่องแล้ว — ตรวจทานอีกครั้งได้ โดยแตะช่องที่วางไว้เพื่อเอาชิ้นส่วนออก"
      : "ชิ้นส่วนที่เหลือ (ลากไปวาง หรือแตะเลือกแล้วแตะช่องว่าง):"),
    pool
  );
}

    canvas.appendChild(p);

    el("span",{class:"run-count"}, "ทดสอบไปแล้ว " + runs + " ครั้ง"),

  }

    panel.appendChild(box);
  }

/* ทดสอบวงจร: รายงานเฉพาะ "จำนวน" ตำแหน่งที่ผิด ไม่ระบุว่าตำแหน่งไหน เพื่อไม่ให้เป็นการเฉลย */
function runCircuitTest(t){
  const ans = dragAnswersFor(t.id);
  const correct = t.slots.filter(sl=>ans[sl.id]===sl.correct).length;
  state.testRuns[t.id] = (state.testRuns[t.id]||0) + 1;
  state.testResult[t.id] = {correct:correct, total:t.slots.length, wrong:t.slots.length-correct};
  render();
}

/* ---------- LEARN 8: block program + ตัวจำลองการทดสอบ ---------- */
const BOT_MAP = [
  ["bot","","obs","","",""],
  ["","","obs","","obs",""],
  ["","","","","obs",""],
  ["obs","","obs","","",""],
  ["","","","","","valve"]
];
const BOT_DIRS = [{r:0,c:1,n:"ตะวันออก →"},{r:1,c:0,n:"ใต้ ↓"},{r:0,c:-1,n:"ตะวันตก ←"},{r:-1,c:0,n:"เหนือ ↑"}];
const BOT_ROWS = BOT_MAP.length, BOT_COLS = BOT_MAP[0].length;
function botIsObstacle(r,c){
  if(r<0||r>=BOT_ROWS||c<0||c>=BOT_COLS) return true;
  return BOT_MAP[r][c]==="obs";
}
function botIsValve(r,c){ return BOT_MAP[r][c]==="valve"; }

/* จำลองการทำงานของโปรแกรมบล็อกที่ผู้เรียนประกอบไว้ */
function simulateBlockProgram(prog, maxSteps, labels){
  maxSteps = maxSteps || 200;
  labels = labels || {};
  const nameOf = id => labels[id] || id || "(ว่าง)";
  let r=0, c=0, d=0;                 // เริ่มที่มุมบนซ้าย หันไปทางตะวันออก
  let valveClosed=false, steps=0, halted=false, bumps=0;
  const visited=[[0,0]];
  const frames=[{r:0, c:0, d:0, note:"เริ่มภารกิจ ที่แถว 1 คอลัมน์ 1 หันไปทาง"+BOT_DIRS[0].n, step:0}];
  const cond = (id)=>{
    if(id==="k_atvalve") return botIsValve(r,c);
    if(id==="k_obstacle"){ const n=BOT_DIRS[d]; return botIsObstacle(r+n.r, c+n.c); }
    if(id==="k_battzero") return steps>=60;
    return false;
  };
  const act = (id)=>{
    if(id==="k_turnright"){ d=(d+1)%4; return "เลี้ยวขวา → หันไปทาง"+BOT_DIRS[d].n; }
    if(id==="k_forward"){
      const n=BOT_DIRS[d];
      if(!botIsObstacle(r+n.r, c+n.c)){ r+=n.r; c+=n.c; visited.push([r,c]); return "เดินหน้า 1 ช่อง → แถว "+(r+1)+" คอลัมน์ "+(c+1); }
      bumps++; return "พยายามเดินหน้าแต่ติดสิ่งกีดขวาง (อยู่ที่เดิม)";
    }
    if(id==="k_closevalve"){
      if(botIsValve(r,c)){ valveClosed=true; return "ปิดวาล์วแก๊สสำเร็จ"; }
      return "สั่งปิดวาล์ว แต่หุ่นยนต์ไม่ได้อยู่ที่ตำแหน่งวาล์ว";
    }
    if(id==="k_stop"){ halted=true; return "หยุดการทำงานถาวร"; }
    return "ส่งเสียงเตือน (ไม่เคลื่อนที่)";
  };
  let reason="";
  while(steps<maxSteps){
    if(prog.b1 && cond(prog.b1)){
      reason="exit";
      frames.push({r, c, d, note:"เงื่อนไขหยุดลูปเป็นจริง ("+nameOf(prog.b1)+") → ออกจากการวนซ้ำ", step:steps});
      break;
    }
    const branch = (prog.b2 && cond(prog.b2));
    const note = act(branch ? prog.b3 : prog.b4);
    steps++;
    frames.push({
      r, c, d, step:steps,
      note:"รอบที่ "+steps+": "+(branch ? "เงื่อนไขเป็นจริง" : "เงื่อนไขเป็นเท็จ")+" → "+note
    });
    if(halted){ reason="halted"; break; }
  }
  if(!reason && steps>=maxSteps){
    reason="timeout";
    frames.push({r, c, d, note:"ครบ "+maxSteps+" รอบคำสั่งแล้วยังไม่จบ — หยุดการจำลอง", step:steps});
  }
  if(prog.b5){
    const note = act(prog.b5);
    frames.push({r, c, d, note:"หลังออกจากลูป: "+note, step:steps});
  }
  return {valveClosed, steps, r, c, facing:BOT_DIRS[d].n, reason, visited, bumps, frames};
}

/* ---- ตัวเล่นภาพเคลื่อนไหว: เดินทีละช่องตามผลการจำลอง ---- */
let animTimer = null;
function stopAnim(){
  if(animTimer){ clearInterval(animTimer); animTimer = null; }
  state.anim = null;
}
function runBlockTest(t){
  stopAnim();
  const labels = {};
  t.items.forEach(it=>{ labels[it.id] = it.label; });
  const res = simulateBlockProgram(dragAnswersFor(t.id), 200, labels);
  state.testRuns[t.id] = (state.testRuns[t.id]||0) + 1;
  state.testResult[t.id] = null;          // ซ่อนผลไว้ก่อน ให้ดูหุ่นยนต์เดินก่อน
  state.anim = {taskId:t.id, frames:res.frames, idx:0, result:res};
  render();
  animTimer = setInterval(()=>tickAnim(t), 420);
}
function tickAnim(t){
  const a = state.anim;
  const gridEl = document.getElementById("botGrid");
  if(!a || !gridEl){ stopAnim(); return; }   // ผู้ใช้ออกจากหน้านี้แล้ว
  if(a.idx >= a.frames.length - 1){ finishAnim(t); return; }
  a.idx++;
  paintAnimFrame();
}
function finishAnim(t){
  const a = state.anim;
  if(!a) return;
  const res = a.result;
  stopAnim();
  state.testResult[t.id] = res;
  render();
}
function paintAnimFrame(){
  const a = state.anim;
  if(!a) return;
  const gridEl = document.getElementById("botGrid");
  if(!gridEl) return;
  const f = a.frames[a.idx];
  const seen = {};
  for(let k=0; k<=a.idx; k++){ seen[a.frames[k].r+","+a.frames[k].c] = true; }
  paintGridCells(gridEl, {r:f.r, c:f.c, seen:seen});
  const st = document.getElementById("animStatus");
  if(st) st.textContent = f.note;
  const pg = document.getElementById("animProgress");
  if(pg) pg.textContent = "เฟรม " + (a.idx+1) + "/" + a.frames.length;
}
function paintGridCells(gridEl, view){
  const cells = gridEl.children;
  let i = 0;
  for(let ri=0; ri<BOT_ROWS; ri++){
    for(let ci=0; ci<BOT_COLS; ci++){
      const cell = cells[i++];
      if(!cell) continue;
      const raw = BOT_MAP[ri][ci];
      let cls = "gm-cell";
      if(raw==="obs") cls += " obstacle";
      else if(raw==="valve") cls += " valve";
      let glyph = raw==="valve" ? "🔧" : raw==="obs" ? "▧" : "";
      if(view){
        if(view.seen && view.seen[ri+","+ci] && raw!=="obs") cls += " path";
        if(view.r===ri && view.c===ci){ cls += " final"; glyph = "🤖"; }
      } else if(raw==="bot"){
        cls += " bot"; glyph = "🤖";
      }
      cell.className = cls;
      cell.textContent = glyph;
    }
  }
}

function renderBlocksTask(panel, t){
  const byId = id => t.slots.find(s=>s.id===id);
  const result = state.testResult[t.id];
  const anim = (state.anim && state.anim.taskId===t.id) ? state.anim : null;

  // ตารางสถานการณ์ (วาดเซลล์เปล่าไว้ก่อน แล้วให้ paintGridCells กำหนดสถานะ)
  const grid = el("div",{class:"grid-map", id:"botGrid"});
  for(let k=0; k<BOT_ROWS*BOT_COLS; k++) grid.appendChild(el("div",{class:"gm-cell"}));
  panel.appendChild(grid);

  let view = null;
  if(anim){
    const f = anim.frames[anim.idx];
    const seen = {};
    for(let k=0; k<=anim.idx; k++){ seen[anim.frames[k].r+","+anim.frames[k].c] = true; }
    view = {r:f.r, c:f.c, seen:seen};
  } else if(result){
    const seen = {};
    result.visited.forEach(v=>{ seen[v[0]+","+v[1]] = true; });
    view = {r:result.r, c:result.c, seen:seen};
  }
  paintGridCells(grid, view);

  panel.appendChild(el("div",{class:"grid-legend"},

/* ---------- LEARN 10: โปรแกรมควบคุมระบบดับเพลิง + ตัวจำลอง ---------- */
const FIRE_START_TEMP = 85, FIRE_START_WATER = 100, FIRE_MAX_TICKS = 60;

function simulateFireProgram(prog, labels){
  labels = labels || {};
  let temp = FIRE_START_TEMP, water = FIRE_START_WATER;
  let ticks = 0, halted = false, reported = false, dry = false;
  let pump = "off";
  const frames = [{temp:temp, water:water, pump:"off", tick:0,
    note:"เริ่มระบบดับเพลิง · อุณหภูมิ " + temp + "°C · น้ำ " + water + "%"}];
  const cond = (id)=>{
    if(id==="k_cool") return temp < 45;
    if(id==="k_hot")  return temp >= 60;
    if(id==="k_warm") return temp >= 20;
    return false;
  };
  const act = (id)=>{
    if(id==="k_pumphigh"){
      if(water>=9){ water-=9; temp-=9; pump="high"; return "เปิดปั๊มแรงดันสูง (-9°C, ใช้น้ำ 9%)"; }
      dry=true; return "น้ำไม่พอสำหรับแรงดันสูง";
    }
    if(id==="k_pumplow"){
      if(water>=3){ water-=3; temp-=5; pump="low"; return "ฉีดแรงดันต่ำ (-5°C, ใช้น้ำ 3%)"; }
      dry=true; return "น้ำไม่พอ";
    }
    if(id==="k_servosweep"){
      if(water>=1){ water-=1; temp-=3; return "กวาดเซอร์โวหัวฉีด 30°–150° (-3°C)"; }
      dry=true; return "น้ำไม่พอสำหรับการกวาดหัวฉีด";
    }
    if(id==="k_report"){ pump="off"; reported=true; return "ปิดปั๊มและรายงานศูนย์ควบคุม"; }
    if(id==="k_halt"){ halted=true; return "หยุดระบบถาวร"; }
    if(id==="k_led"){ return "เปิดไฟสัญญาณเตือนอย่างเดียว (ไม่ได้ฉีดน้ำ)"; }
    return "(ยังไม่ได้วางบล็อก)";
  };
  let reason="";
  while(ticks < FIRE_MAX_TICKS){
    if(prog.c1 && cond(prog.c1)){
      reason="cooled";
      frames.push({temp:Math.round(temp), water:water, pump:pump, tick:ticks,
        note:"เงื่อนไขหยุดลูปเป็นจริง ("+(labels[prog.c1]||prog.c1)+") → ออกจากการวนซ้ำ"});
      break;
    }
    const hot = prog.c2 && cond(prog.c2);
    let note;
    if(hot){ note = act(prog.c3) + " + " + act(prog.c4); }
    else { note = act(prog.c5); }
    const growth = temp>=60 ? 6 : 2;
    temp += growth;
    if(temp < 0) temp = 0;
    ticks++;
    frames.push({temp:Math.round(temp), water:water, pump:pump, tick:ticks,
      note:"รอบที่ "+ticks+": "+(hot?"ตรวจพบการเผาไหม้รุนแรง":"ยังไม่ร้อนจัด")+" → "+note+" · ไฟลุกเพิ่ม +"+growth+"°C"});
    if(halted){ reason="halted"; break; }
  }
  if(!reason && ticks>=FIRE_MAX_TICKS){
    reason="timeout";
    frames.push({temp:Math.round(temp), water:water, pump:pump, tick:ticks,
      note:"ครบ "+FIRE_MAX_TICKS+" รอบแล้วไฟยังไม่ดับ — หยุดการจำลอง"});
  }
  if(prog.c6){
    const n = act(prog.c6);
    frames.push({temp:Math.round(temp), water:water, pump:pump, tick:ticks, note:"หลังออกจากลูป: "+n});
  }
  const success = (temp < 45) && reported && !halted;
  return {success:success, temp:Math.round(temp), water:water, ticks:ticks,
    reason:reason, reported:reported, dry:dry, halted:halted, frames:frames};
}

function runFireTest(t){
  stopAnim();
  const labels = {};
  t.items.forEach(it=>{ labels[it.id] = it.label; });
  const res = simulateFireProgram(dragAnswersFor(t.id), labels);
  state.testRuns[t.id] = (state.testRuns[t.id]||0) + 1;
  state.testResult[t.id] = null;
  state.anim = {taskId:t.id, frames:res.frames, idx:0, result:res, kind:"fire"};
  render();
  animTimer = setInterval(()=>tickFireAnim(t), 420);
}
function tickFireAnim(t){
  const a = state.anim;
  if(!a || !document.getElementById("fireGauge")){ stopAnim(); return; }
  if(a.idx >= a.frames.length - 1){
    const res = a.result;
    stopAnim();
    state.testResult[t.id] = res;
    render();
    return;
  }
  a.idx++;
  paintFireFrame();
}
function paintFireFrame(){
  const a = state.anim;
  if(!a) return;
  const f = a.frames[a.idx];
  const tempFill = document.getElementById("fireTempFill");
  const waterFill = document.getElementById("fireWaterFill");
  const tempVal = document.getElementById("fireTempVal");
  const waterVal = document.getElementById("fireWaterVal");
  const st = document.getElementById("animStatus");
  const pg = document.getElementById("animProgress");
  if(tempFill){
    tempFill.style.width = Math.max(0, Math.min(100, (f.temp/120)*100)) + "%";
    tempFill.className = "gauge-fill " + (f.temp>=60 ? "hot" : (f.temp<45 ? "safe" : "warm"));
  }
  if(waterFill) waterFill.style.width = Math.max(0, f.water) + "%";
  if(tempVal) tempVal.textContent = f.temp + "°C";
  if(waterVal) waterVal.textContent = f.water + "%";
  if(st) st.textContent = f.note;
  if(pg) pg.textContent = "เฟรม " + (a.idx+1) + "/" + a.frames.length;
}

function drawLearnChart(canvasId, chartDef){
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  if(typeof Chart === "undefined"){
    // Chart.js ยังไม่พร้อมใช้งาน (เช่น กำลังโหลด CDN สำรอง หรือเครือข่ายบล็อก CDN) — ลองใหม่อีกครั้งสั้น ๆ ก่อนแสดงตารางสำรอง
    if(!drawLearnChart._retries) drawLearnChart._retries = {};
    const tries = drawLearnChart._retries[canvasId] || 0;
    if(tries < 20){
      drawLearnChart._retries[canvasId] = tries + 1;
      setTimeout(()=>drawLearnChart(canvasId, chartDef), 250);
      return;
    }
    renderChartFallbackTable(ctx, chartDef);
    return;
  }
  try{
    chartInstances[canvasId] = new Chart(ctx, {
      type: chartDef.type,
      data:{
        labels: chartDef.labels,
        datasets: chartDef.datasets.map(d=>({
          label:d.label, data:d.data,
          borderColor:d.color, backgroundColor:chartDef.type==="bar" ? d.color+"CC" : d.color+"33",
          borderWidth:2, tension:0.3, fill: chartDef.type==="line"
        }))
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:"#EAF2F1", font:{family:"Inter", size:11} } } },
        scales:{
          x:{ ticks:{color:"#85A0AA"}, grid:{color:"#26374380"} },
          y:{ ticks:{color:"#85A0AA"}, grid:{color:"#26374380"} }
        }
      }
    });
  } catch(err){
    renderChartFallbackTable(ctx, chartDef);
  }
}

function renderChartFallbackTable(canvasEl, chartDef){
  // แสดงข้อมูลเป็นตารางแทนกราฟ เมื่อไลบรารีกราฟโหลดไม่สำเร็จ เพื่อให้เนื้อหายังใช้งานได้ครบถ้วน
  const box = canvasEl.closest(".chart-box");
  if(!box) return;
  box.style.height = "auto";
  box.style.overflowX = "auto";
  const table = el("table",{class:"mission-table"},
    el("tr",{}, el("th",{},""), chartDef.labels.map(l=>el("th",{}, l))),
    chartDef.datasets.map(d=>el("tr",{},
      el("td",{}, d.label),
      d.data.map(v=>el("td",{class:"mono"}, String(v)))
    ))
  );

function setAccuracyReadout(actId, correct, total){
  const acc = pct((correct/total)*100);
  const numEl = document.getElementById("accnum_"+actId);
  const wrapEl = document.getElementById("acc_"+actId);
  if(numEl) numEl.textContent = acc + "% (" + correct + "/" + total + ")";
  if(wrapEl) wrapEl.className = "accuracy-readout" + (acc===100 ? " perfect" : "");
  if(state.applyResults[actId]) state.applyResults[actId].accuracy = acc;
}

function updateApplyLiveA1A3A5(act, st){
  const lo = act.thresholds.lo, hi = act.thresholds.hi;
  let correct = 0;
  const rows = act.missions.map(m=>{
    const s = scoreOf(m.f, st.weights);
    const pred = label3(s, lo, hi);
    const match = pred === m.trueLabel;
    if(match) correct++;
    return {name:m.name, score:pct(s), pred, truth:m.trueLabel, match};
  });
  setAccuracyReadout(act.id, correct, act.missions.length);
  const table = el("table",{class:"mission-table"},
    el("tr",{}, el("th",{},"รายการ"), el("th",{},"คะแนนคำนวณได้"), el("th",{},"ผลทำนาย"), el("th",{},"ผลจริง"), el("th",{},"")),
    rows.map(r=>el("tr",{},
      el("td",{}, r.name),
      el("td",{class:"mono"}, r.score),
      el("td",{}, el("span",{class:"tag-pill tag-"+r.pred}, labelThai(r.pred))),
      el("td",{}, el("span",{class:"tag-pill tag-"+r.truth}, labelThai(r.truth))),
      el("td",{class: r.match?"match-yes":"match-no"}, r.match?"✓ ตรงกัน":"✗ ไม่ตรง")
    ))
  );
  const tw = document.getElementById("table_"+act.id);
  if(tw){ tw.innerHTML=""; tw.appendChild(table); }
}

  const lo = st.thresholds.lo, hi = st.thresholds.hi;

  const rows = act.missions.map(m=>{

    rows.map(r=>el("tr",{},
      el("td",{}, r.name),

      el("td",{}, el("span",{class:"tag-pill tag-"+r.pred}, labelThai(r.pred))),

    rows.map(r=>el("tr",{},

      el("td",{class:"mono"}, r.danger),
      el("td",{}, el("span",{class:"tag-pill tag-"+r.pred}, r.pred)),

function reflectIsComplete(){

}

/* =========================================================
   SCORING
   ========================================================= */
/* น้ำหนักของแต่ละภาระงานภายในขั้น LEARN:
   ภาระงานแบบเลือกตอบ (1-6) ภาระงานละ 1 หน่วย = 6 หน่วย
   ภาระงานปฏิบัติลากวาง (7-10) ภาระงานละ 2 หน่วย = 8 หน่วย  → รวม 14 หน่วย
   ภาระงานลากวางให้คะแนนตามสัดส่วนช่องที่วางถูก (partial credit) */
function isPracticalTask(t){ return t.kind==="circuit"||t.kind==="blocks"||t.kind==="fireblocks"; }
function learnTaskWeight(t){ return isPracticalTask(t) ? 2 : 1; }
function learnTaskFraction(t){
  if(!t.kind || t.kind==="mc"){
    return state.learnAnswers[t.id]===t.question.correct ? 1 : 0;
  }
  const ans = state.dragAnswers[t.id] || {};
  const correct = t.slots.filter(s=>ans[s.id]===s.correct).length;
  return correct / t.slots.length;
}

function computeScores(){
  const showCorrect = SHOW_QUESTIONS.filter(q=>state.showAnswers[q.id]===q.correct).length;
  const showScore = pct((showCorrect/SHOW_QUESTIONS.length)*100);

  let learnUnitsEarned = 0, learnUnitsTotal = 0;
  LEARN_TASKS.forEach(t=>{
    const w = learnTaskWeight(t);
    learnUnitsTotal += w;
    learnUnitsEarned += learnTaskFraction(t) * w;
  });
  const learnScore = pct((learnUnitsEarned/learnUnitsTotal)*100);
  const learnMcCorrect = LEARN_TASKS.filter(t=>(!t.kind||t.kind==="mc") && state.learnAnswers[t.id]===t.question.correct).length;
  const learnMcTotal = LEARN_TASKS.filter(t=>!t.kind||t.kind==="mc").length;
  const learnTaskDetail = LEARN_TASKS.filter(t=>isPracticalTask(t)).map(t=>{
    const ans = state.dragAnswers[t.id] || {};
    const c = t.slots.filter(s=>ans[s.id]===s.correct).length;
    return {id:t.id, correct:c, total:t.slots.length};
  });

  const applyAccuracies = APPLY_ACTIVITIES.map(a=> (state.applyResults[a.id] && state.applyResults[a.id].accuracy) || 0);
  const applyScore = pct(applyAccuracies.reduce((a,b)=>a+b,0)/APPLY_ACTIVITIES.length);

  const likertPoints = REFLECT_LIKERT.reduce((acc,_,idx)=> acc + (state.reflectLikert["lk"+idx]!==undefined ? 20 : 0), 0); // 4*20=80
  const openPoints = REFLECT_OPEN.reduce((acc,q)=>{
    const chars = (state.reflectOpen[q.id]||"").trim().length;
    return acc + (chars>=40 ? 10 : (chars>0 ? 5 : 0)); // 2*10=20
  }, 0);
  const reflectScore = pct(likertPoints + openPoints);

  // สัดส่วนล่าสุด: LEARN มี 10 ภาระงาน (6 เลือกตอบ + 4 ปฏิบัติ) จึงเพิ่มเป็น 45%
  // APPLY ลดจาก 35% เป็น 30% · SHOW 10% · REFLECT 15% รวม 100%
  const overall = pct(showScore*0.10 + learnScore*0.45 + applyScore*0.30 + reflectScore*0.15);
  let level = 1, levelLabel = "ระดับ 1 — ควรพัฒนาเพิ่มเติม (Needs Improvement)", levelClass="L1";
  if(overall>=85){ level=4; levelLabel="ระดับ 4 — ขั้นสูง (Advanced)"; levelClass="L4"; }
  else if(overall>=70){ level=3; levelLabel="ระดับ 3 — ชำนาญ (Proficient)"; levelClass="L3"; }
  else if(overall>=50){ level=2; levelLabel="ระดับ 2 — พื้นฐาน (Basic)"; levelClass="L2"; }

  return {showScore, learnScore, applyScore, reflectScore, overall, level, levelLabel, levelClass,
    showCorrect, learnUnitsEarned:pct(learnUnitsEarned), learnUnitsTotal, learnMcCorrect, learnMcTotal, learnTaskDetail};
}

/* =========================================================
   SUBMIT
   ========================================================= */
function finishAndSubmit(){
  stopAnim();
  state.scores = computeScores();
  state.screen = "report";
  render();
  if(countdownIntervalId){ clearInterval(countdownIntervalId); countdownIntervalId = null; }
  submitToSheet(state.scores);
}

/* =========================================================
   บันทึกผลลง Google Sheet ผ่าน universal logger (code.gs)
   payload ต้องมีฟิลด์ "sheet" เพื่อบอกแท็บปลายทาง
   object ซ้อน (learn_detail ฯลฯ) ฝั่ง Apps Script จะ flatten
   เป็นคอลัมน์ย่อยให้เอง เช่น learn_detail_task1
   ========================================================= */
function buildPayload(scores){
  const learnDetail = {}, testRuns = {};
  LEARN_TASKS.forEach((t, i)=>{
    learnDetail["task" + (i+1)] = pct(learnTaskFraction(t) * 100);
    if(isPracticalTask(t)) testRuns["task" + (i+1)] = state.testRuns[t.id] || 0;
  });
  const applyDetail = {};
  APPLY_ACTIVITIES.forEach((a, i)=>{
    applyDetail["activity" + (i+1)] =
      (state.applyResults[a.id] && state.applyResults[a.id].accuracy !== undefined)
        ? state.applyResults[a.id].accuracy : 0;
  });
  const durationSec = state.startTime ? Math.round((Date.now() - state.startTime)/1000) : 0;

  return {
    sheet: CONFIG.sheetName,                 // ← บอกแท็บปลายทางให้ universal logger
    timestamp: new Date().toISOString(),
    scenario: CONFIG.scenario,
    user: state.name,
    grade: state.grade,
    show: scores.showScore,
    learn: scores.learnScore,
    apply: scores.applyScore,
    reflect: scores.reflectScore,
    overall: scores.overall,
    level: scores.level,
    levelName: scores.levelLabel,
    learn_detail: learnDetail,
    apply_detail: applyDetail,
    test_runs: testRuns,
    show_correct: scores.showCorrect,
    show_total: SHOW_QUESTIONS.length,
    learn_units_earned: scores.learnUnitsEarned,
    learn_units_total: scores.learnUnitsTotal,
    duration_sec: durationSec,
    timedOut: !!state.timedOut
  };
}

function submitToSheet(scores){
  if(state.submitted) return;               // กันการบันทึกซ้ำโดยไม่ตั้งใจ
  state.submitted = true;
  sendPayload(buildPayload(scores));
}

function setSaveStatus(text, cls){
  const el0 = document.getElementById("saveStatus");
  if(el0){ el0.textContent = text; el0.className = "save-status" + (cls ? " " + cls : ""); }
}

function sendPayload(payload){
  setSaveStatus("กำลังบันทึกผลลง Google Sheet (แท็บ " + CONFIG.sheetName + ")...");
  // ใช้ Content-Type: text/plain เพื่อให้เป็น simple request ไม่เกิด CORS preflight
  fetch(CONFIG.webhookUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  })
  .then(r => r.json().catch(()=>({ result:"unknown" })))
  .then(res => {
    if(res && res.result === "success"){
      setSaveStatus("บันทึกผลเรียบร้อยแล้ว ✓  (แท็บ " + (res.sheet || CONFIG.sheetName) +
                    (res.row ? " แถวที่ " + res.row : "") + ")", "ok");
      saveLocalHistory(payload);
      renderHistory();
    } else if(res && res.result === "error"){
      setSaveStatus("เซิร์ฟเวอร์แจ้งข้อผิดพลาด: " + (res.error || "ไม่ทราบสาเหตุ"), "fail");
      showRetry(payload);
    } else {
      // ส่งสำเร็จแต่อ่านผลลัพธ์ไม่ได้ (เบราว์เซอร์บล็อกการอ่าน response ข้ามโดเมน)
      setSaveStatus("ส่งข้อมูลแล้ว แต่ไม่สามารถอ่านผลตอบกลับได้ — โปรดตรวจสอบแท็บ " +
                    CONFIG.sheetName + " ในสเปรดชีตอีกครั้ง", "warn");
      saveLocalHistory(payload);
      renderHistory();
    }
  })
  .catch(() => {
    setSaveStatus("ไม่สามารถบันทึกผลอัตโนมัติได้ (เครือข่ายขัดข้องหรือยังไม่ได้ deploy Web App) — ผลของคุณยังแสดงครบถ้วนด้านล่าง", "fail");
    saveLocalHistory(payload);
    renderHistory();
    showRetry(payload);
  });
}

function showRetry(payload){
  const wrap = document.getElementById("retryWrap");
  if(!wrap) return;
  wrap.innerHTML = "";
  wrap.appendChild(el("button",{class:"btn btn-ghost", style:"padding:8px 16px;font-size:.84rem;", onclick:()=>{
    wrap.innerHTML = "";
    sendPayload(payload);          // ส่ง payload ชุดเดิม ไม่สร้างใหม่ เพื่อไม่ให้ timestamp เพี้ยน
  }},"ลองบันทึกอีกครั้ง"));
  wrap.appendChild(el("button",{class:"btn btn-ghost", style:"padding:8px 16px;font-size:.84rem;margin-left:8px;", onclick:()=>{
    navigator.clipboard && navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    setSaveStatus("คัดลอกข้อมูลผลสอบ (JSON) ไปยังคลิปบอร์ดแล้ว — ส่งให้ครูบันทึกด้วยตนเองได้", "warn");
  }},"คัดลอกผลเป็น JSON"));
}

/* ---------- ประวัติการทำแบบทดสอบ (เก็บในเครื่องผู้ใช้) ----------
   universal logger ใน code.gs รองรับเฉพาะการเขียน (doPost)
   ส่วน doGet คืนเพียงสถานะของ Web App จึงดึงประวัติจากเซิร์ฟเวอร์ไม่ได้
   แอปจึงเก็บประวัติไว้ในเบราว์เซอร์ของผู้เข้าสอบเอง                     */
function readLocalHistory(){
  try{
    const raw = localStorage.getItem(CONFIG.historyKey);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveLocalHistory(payload){
  try{
    const arr = readLocalHistory();
    // payload.timestamp คงที่ตลอดอายุของผลชุดนี้ จึงใช้กันไม่ให้บันทึกซ้ำเมื่อกด "ลองบันทึกอีกครั้ง"
    if(arr.some(r => r.timestamp === payload.timestamp)) return;
    arr.push({
      timestamp: payload.timestamp,
      user: payload.user,
      grade: payload.grade,
      overall: payload.overall,
      levelName: payload.levelName
    });
    while(arr.length > 20) arr.shift();      // เก็บไว้ไม่เกิน 20 ครั้งล่าสุด
    localStorage.setItem(CONFIG.historyKey, JSON.stringify(arr));
  }catch(e){ /* โหมดส่วนตัวของเบราว์เซอร์อาจไม่อนุญาต — ข้ามไป */ }
}
function fmtTime(iso){
  try{
    const d = new Date(iso);
    const pad = n => String(n).padStart(2,"0");
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) +
           " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }catch(e){ return iso || "-"; }
}
function renderHistory(){
  const wrap = document.getElementById("historyWrap");
  if(!wrap) return;
  const rows = readLocalHistory().filter(r => (r.user||"").trim() === (state.name||"").trim());
  wrap.innerHTML = "";
  if(rows.length === 0){
    wrap.appendChild(el("p",{class:"lede"},"ยังไม่มีประวัติการทำแบบทดสอบก่อนหน้าของชื่อนี้ในเครื่องนี้"));
    return;
  }
  wrap.appendChild(el("table",{class:"hist-table"},
    el("tr",{}, el("th",{},"วันเวลา"), el("th",{},"ระดับชั้น"), el("th",{},"คะแนนรวม"), el("th",{},"ระดับคุณภาพ")),
    rows.slice().reverse().map(r=>el("tr",{},
      el("td",{}, fmtTime(r.timestamp)),
      el("td",{}, r.grade || "-"),
      el("td",{class:"mono"}, (r.overall!==undefined ? r.overall + "%" : "-")),
      el("td",{}, r.levelName || "-")
    ))
  ));
}

/* =========================================================
   RENDER: REPORT
   ========================================================= */
function renderReport(){
  const s = state.scores || computeScores();
  const wrap = el("div",{});
  wrap.appendChild(el("h1",{}, "รายงานผลภารกิจ RESCUE-BOT"));
  wrap.appendChild(el("p",{class:"lede"}, el("b",{}, state.name), " · ระดับชั้น " + state.grade));

  const band = el("div",{class:"overall-band"});
  band.appendChild(el("div",{class:"score-big"}, "คะแนนรวมทั้งฉบับ"));
  band.appendChild(el("div",{class:"level "+s.levelClass}, s.overall + "%"));
  band.appendChild(el("div",{class:"score-big"}, s.levelLabel));
  wrap.appendChild(band);

  const grid = el("div",{class:"score-grid"});
  grid.appendChild(scoreCard("SHOW", s.showScore, "#3FCFB4", s.showCorrect+"/"+SHOW_QUESTIONS.length+" ข้อถูก"));
  grid.appendChild(scoreCard("LEARN", s.learnScore, "#F2A93B", s.learnUnitsEarned+"/"+s.learnUnitsTotal+" หน่วยคะแนน"));
  grid.appendChild(scoreCard("APPLY", s.applyScore, "#FF6A39", "เฉลี่ยความแม่นยำ 5 กิจกรรม"));
  grid.appendChild(scoreCard("REFLECT", s.reflectScore, "#6FCF97", "ความครบถ้วนของคำตอบ"));
  wrap.appendChild(grid);

  const learnDetail = el("div",{class:"panel"});
  learnDetail.appendChild(el("h3",{},"รายละเอียดคะแนน LEARN รายภาระงาน"));
  const lTable = el("table",{class:"mission-table"},
    el("tr",{}, el("th",{},"ภาระงาน"), el("th",{},"ประเภท"), el("th",{},"ผลงาน"), el("th",{},"น้ำหนัก")),
    LEARN_TASKS.map(t=>{
      const isDrag = isPracticalTask(t);
      let resultText;
      if(isDrag){
        const ans = state.dragAnswers[t.id] || {};
        const c = t.slots.filter(s=>ans[s.id]===s.correct).length;
        resultText = "วางถูก " + c + "/" + t.slots.length + " ช่อง";
        const runs = state.testRuns[t.id] || 0;
        const res = state.testResult[t.id];
        resultText += " · ทดสอบ " + runs + " ครั้ง";
        if(res){
          let passed;
          if(t.kind==="blocks") passed = res.valveClosed;
          else if(t.kind==="fireblocks") passed = res.success;
          else passed = (res.wrong === 0);
          resultText += (passed ? " · ครั้งล่าสุดผ่าน" : " · ครั้งล่าสุดยังไม่ผ่าน");
        }
      } else {
        resultText = state.learnAnswers[t.id]===t.question.correct ? "ตอบถูก" : "ตอบผิด";
      }
      return el("tr",{},
        el("td",{}, t.title),
        el("td",{}, isDrag ? "ปฏิบัติ (ลากวาง)" : "เลือกตอบ"),
        el("td",{class:"mono"}, resultText),
        el("td",{class:"mono"}, learnTaskWeight(t) + " หน่วย")
      );
    })
  );
  learnDetail.appendChild(lTable);
  wrap.appendChild(learnDetail);

  const applyDetail = el("div",{class:"panel"});
  applyDetail.appendChild(el("h3",{},"รายละเอียดความแม่นยำ APPLY รายกิจกรรม"));
  const dTable = el("table",{class:"mission-table"},
    el("tr",{}, el("th",{},"กิจกรรม"), el("th",{},"ความแม่นยำ")),
    APPLY_ACTIVITIES.map(a=>el("tr",{},
      el("td",{}, a.title),
      el("td",{class:"mono"}, (state.applyResults[a.id] && state.applyResults[a.id].accuracy!==undefined ? state.applyResults[a.id].accuracy : 0)+"%")
    ))
  );
  applyDetail.appendChild(dTable);
  wrap.appendChild(applyDetail);

  const savePanel = el("div",{class:"panel"});
  savePanel.appendChild(el("h3",{},"การบันทึกผล"));
  savePanel.appendChild(el("div",{class:"save-status", id:"saveStatus"}, "กำลังเตรียมบันทึกผล..."));
  savePanel.appendChild(el("div",{id:"retryWrap", style:"margin-top:10px;"}));
  savePanel.appendChild(el("h4",{style:"margin-top:18px;"},"ประวัติการทำแบบทดสอบของคุณ"));
  savePanel.appendChild(el("div",{id:"historyWrap"}));
  setTimeout(renderHistory, 0);
  wrap.appendChild(savePanel);

  const btnRow = el("div",{class:"btn-row"});
  btnRow.appendChild(el("button",{class:"btn btn-primary", onclick:()=>{
    location.reload();
  }}, "เริ่มทำแบบทดสอบใหม่"));
  wrap.appendChild(btnRow);

  return wrap;
}

function scoreCard(label, val, color, sub){
  const c = el("div",{class:"score-card", style:"border-top:3px solid "+color+";"});
  c.appendChild(el("div",{class:"label"}, label));
  c.appendChild(el("div",{class:"val", style:"color:"+color+";"}, val+"%"));
  c.appendChild(el("div",{class:"label"}, sub));
  return c;
}

function progressBar(idx, total, labelPrefix){
  const wrap = el("div",{class:"progress-wrap"});
  const track = el("div",{class:"progress-track"});
  track.appendChild(el("div",{class:"progress-fill", style:"width:"+(((idx+1)/total)*100)+"%;"}));
  wrap.appendChild(track);
  wrap.appendChild(el("div",{class:"progress-label"}, labelPrefix + " " + (idx+1) + "/" + total));
  return wrap;
}

/* =========================================================
   BOOT
   ========================================================= */
render();
</script>
</body>
</html>
